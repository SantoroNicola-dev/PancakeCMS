services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pancakecms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pancakecms_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-pancakecms_db}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pancakecms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pancakecms} -d $${POSTGRES_DB:-pancakecms_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pancakecms:pancakecms_secret_password@db:5432/pancakecms_db?schema=public}
      JWT_SECRET: ${JWT_SECRET:-pancakecms-super-secret-jwt-key-change-in-production-2026}
      NEXT_PUBLIC_SITE_URL: ${SERVICE_URL_APP:-${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}}
      FORCE_SEED: ${FORCE_SEED:-false}
    expose:
      - "3000"
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    volumes:
      - pancakecms_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 5

volumes:
  pancakecms_pgdata:
  pancakecms_uploads:
